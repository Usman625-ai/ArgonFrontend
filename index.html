<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon / brand mark -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#15110D" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet" />

  <title>Argon — Multi-Vendor E-Commerce</title>
  <meta name="description" content="Argon is a trusted multi-vendor marketplace — curated goods from thousands of sellers across Pakistan, with secure checkout and nationwide delivery." />

  <!-- Open Graph / social + search preview -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Argon" />
  <meta property="og:title" content="Argon — Multi-Vendor E-Commerce" />
  <meta property="og:description" content="A trusted multi-vendor marketplace with curated goods from thousands of sellers across Pakistan." />
  <meta property="og:image" content="/favicon-512.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Argon — Multi-Vendor E-Commerce" />
  <meta name="twitter:description" content="A trusted multi-vendor marketplace with curated goods from thousands of sellers across Pakistan." />
  <meta name="twitter:image" content="/favicon-512.png" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
